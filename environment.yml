# Conda alternative to orchestrator/.venv. All channels are conda-forge.
name: kenjin
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26,<2
  - pandas>=2.2,<3
  - scikit-learn>=1.5,<2
  - lightgbm>=4.3,<5
  - joblib>=1.3,<2
  - polars>=1,<2
  - redis-py>=5,<7
  - asyncpg>=0.29,<1
  - postgresql=16.*
  - pip:
    - fastapi>=0.115,<1
    - uvicorn[standard]>=0.30,<1
    - APScheduler>=3.10,<4
    - pydantic>=2.8,<3
    - python-dotenv>=1,<2
    - groq>=1,<2
    - httpx>=0.27,<1
    - river>=0.21,<1
    - yfinance>=0.2.66,<1
    - websockets>=12,<16
    - pytest>=8,<10
